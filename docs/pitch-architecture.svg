<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1270" width="1600" height="1270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a817a"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker>
    <style>
      .t { font-size: 17px; font-weight: 600; fill: #1d1b1a; }
      .s { font-size: 13.5px; fill: #5f5853; }
      .k { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; fill: #8a817a; }
      .box { fill: #ffffff; stroke: #e2dcd5; stroke-width: 1.5; }
      .stage { fill: #fff6f3; stroke: #e2553f; stroke-width: 2; }
      .code { fill: #f4f1ed; stroke: #1d1b1a; stroke-width: 2; }
      .alex { fill: #eef8f2; stroke: #1f8a5b; stroke-width: 2; }
      .panel { fill: #faf8f5; stroke: #e2dcd5; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .line { stroke: #8a817a; stroke-width: 2; fill: none; marker-end: url(#ar); }
      .loop { stroke: #1f8a5b; stroke-width: 2.5; fill: none; marker-end: url(#arc); stroke-dasharray: 8 6; }
      .badge { fill: #e2553f; } .badgeT { font-size: 11px; font-weight: 700; fill: #fff; letter-spacing: .06em; }
      .gbadge { fill: #1f8a5b; }
    </style>
  </defs>

  <rect width="1600" height="1270" fill="#fbfaf8"/>

  <!-- title -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#1d1b1a"><tspan fill="#e2553f">Uno</tspan> Re<tspan fill="#1f8a5b">Voice</tspan> · how a call is handled</text>
  <text x="40" y="86" class="s" font-size="15">7 Gemini models · models propose, code decides, Alex has the final say · it learns from every call</text>

  <!-- column labels -->
  <text x="40" y="124" class="k">THE CALL</text>
  <text x="300" y="124" class="k">EARS</text>
  <text x="530" y="124" class="k">LIVE BRAIN · EVERY CALLER LINE, IN PARALLEL</text>
  <text x="950" y="124" class="k">APP CODE</text>
  <text x="1200" y="124" class="k">ALEX + VOICE</text>

  <!-- inputs -->
  <rect class="box" x="40" y="200" width="220" height="56" rx="10"/><text x="58" y="224" class="t">Phone line</text><text x="58" y="244" class="s">Twilio Media Streams</text>
  <rect class="box" x="40" y="276" width="220" height="56" rx="10"/><text x="58" y="300" class="t">Desk mic</text><text x="58" y="320" class="s">you play the caller</text>
  <rect class="box" x="40" y="352" width="220" height="56" rx="10"/><text x="58" y="376" class="t">Gemini caller</text><text x="58" y="396" class="s">3.5 Flash-Lite plays a role</text>

  <!-- transcribe -->
  <rect class="box" x="300" y="240" width="190" height="130" rx="10"/>
  <text x="318" y="270" class="t">Gemini 3.5</text><text x="318" y="292" class="t">Transcribe Live</text>
  <text x="318" y="318" class="s">live captions,</text><text x="318" y="336" class="s">final line ~1 s after</text><text x="318" y="354" class="s">the caller stops</text>
  <path class="line" d="M260 228 H280 V290 H298"/><path class="line" d="M260 304 H298"/><path class="line" d="M260 380 H280 V320 H298"/>

  <!-- lanes panel -->
  <rect class="panel" x="530" y="140" width="380" height="440" rx="14"/>
  <rect class="box" x="550" y="160" width="340" height="62" rx="10"/><text x="568" y="186" class="t">Rules · regex · 1 ms</text><text x="568" y="208" class="s">instant signs: money, codes, urgency, secrecy</text>
  <rect class="box" x="550" y="234" width="340" height="62" rx="10"/><text x="568" y="260" class="t">Gemini 3.5 Flash-Lite · ~1.3 s</text><text x="568" y="282" class="s">first tailored replies for Alex to tap</text>
  <rect class="stage" x="550" y="308" width="340" height="74" rx="10"/>
  <rect class="badge" x="808" y="318" width="70" height="20" rx="10"/><text x="843" y="332" class="badgeT" text-anchor="middle">STAGE 1</text>
  <text x="568" y="336" class="t">Gemini 4 Hydrogen</text><text x="568" y="358" class="s">flags risks, links each to the caller's</text><text x="568" y="374" class="s">exact words · keeps notes</text>
  <rect class="box" x="550" y="394" width="340" height="62" rx="10"/><text x="568" y="420" class="t">Gemini 4 Argon · planner</text><text x="568" y="442" class="s">next 3 replies, exact words + confidence</text>
  <rect class="stage" x="550" y="468" width="340" height="96" rx="10"/>
  <rect class="badge" x="808" y="478" width="70" height="20" rx="10"/><text x="843" y="492" class="badgeT" text-anchor="middle">STAGE 2</text>
  <text x="568" y="496" class="t">Gemini 4 Neon · supervisor</text><text x="568" y="518" class="s">second assessment of the whole call:</text><text x="568" y="536" class="s">confirms or removes warnings,</text><text x="568" y="554" class="s">checks the proposed replies</text>
  <path class="line" d="M490 305 H528"/>

  <!-- merge + guard -->
  <rect class="code" x="950" y="200" width="210" height="300" rx="12"/>
  <text x="968" y="232" class="t">Merge + guard</text>
  <text x="968" y="252" class="s">models propose,</text><text x="968" y="270" class="s">code decides</text>
  <text x="968" y="306" class="s">• drops stale results</text>
  <text x="968" y="332" class="s">• risk score, fixed</text><text x="980" y="350" class="s">weights: Low · Med · High</text>
  <text x="968" y="376" class="s">• "High risk: confirmed"</text><text x="980" y="394" class="s">lock needs 3 conditions</text>
  <text x="968" y="420" class="s">• say-guard on every line:</text><text x="980" y="438" class="s">no codes, no payments,</text><text x="980" y="456" class="s">no "scam", never as Alex</text>
  <path class="line" d="M910 350 H948"/>

  <!-- alex -->
  <rect class="alex" x="1200" y="160" width="280" height="170" rx="12"/>
  <rect class="gbadge" x="1340" y="170" width="128" height="20" rx="10"/><text x="1404" y="184" class="badgeT" text-anchor="middle">FINAL DECISION</text>
  <text x="1218" y="214" class="t">Alex's desk</text>
  <text x="1218" y="240" class="s">live captions · warning signs</text>
  <text x="1218" y="258" class="s">with the line behind each ·</text>
  <text x="1218" y="276" class="s">risk meter · suggested replies</text>
  <text x="1218" y="306" class="s" font-weight="600" fill="#1f8a5b">Take over · tap · Esc takes back</text>
  <path class="line" d="M1160 290 H1180 V245 H1198"/>

  <!-- voice -->
  <rect class="box" x="1200" y="380" width="280" height="130" rx="12"/>
  <text x="1218" y="410" class="t">Agent voice</text>
  <text x="1218" y="434" class="s">Gemini 3.8 Flash TTS, streamed:</text>
  <text x="1218" y="452" class="s">first sound ~0.7 s · "Mm-hm" ~1.3 s</text>
  <text x="1218" y="470" class="s">reply ~3 s · never talks over</text>
  <text x="1218" y="488" class="s">the caller · stops if interrupted</text>
  <path class="line" d="M1340 330 V378"/><text x="1350" y="360" class="s">hands over</text>
  <path class="line" d="M1160 440 H1198"/><text x="1166" y="430" class="s" font-size="11.5">only</text><text x="1166" y="458" class="s" font-size="11.5">safe</text>
  <circle cx="1536" cy="445" r="40" fill="#ffffff" stroke="#e2dcd5" stroke-width="1.5"/><text x="1536" y="441" class="s" text-anchor="middle" font-weight="600">to the</text><text x="1536" y="458" class="s" text-anchor="middle" font-weight="600">caller</text>
  <path class="line" d="M1480 445 H1494"/>

  <!-- after the call -->
  <line x1="40" y1="622" x2="1560" y2="622" stroke="#e2dcd5" stroke-width="1.5"/>
  <text x="40" y="660" class="k">AFTER HANG-UP</text>
  <rect class="box" x="40" y="676" width="350" height="124" rx="12"/>
  <text x="58" y="706" class="t">Gemini 4 Carbon · review</text><text x="58" y="730" class="s">summary, verdict and tone score</text><text x="58" y="748" class="s">for Alex, plus 8 evals computed</text><text x="58" y="766" class="s">in code (never by a model)</text>
  <rect class="alex" x="420" y="676" width="350" height="124" rx="12"/>
  <text x="438" y="706" class="t">Gemini 4 Neon · follow-up agent</text><text x="438" y="730" class="s">function calling: draft a text or report,</text><text x="438" y="748" class="s">block the number, set a reminder.</text><text x="438" y="772" class="s" font-weight="600" fill="#1f8a5b">Nothing runs until Alex approves.</text>
  <path class="line" d="M390 738 H418"/>
  <rect class="box" x="40" y="820" width="730" height="128" rx="12"/>
  <text x="58" y="850" class="t">Live eval runs (5-call suites, scored 0–100 in code)</text>
  <text x="58" y="878" class="s">Sister scam: 100 · 94 · 100 · 100 · 97. Call 2 only offered a callback after a $900 ask; the critic wrote</text>
  <text x="58" y="896" class="s">lesson L-001, "when a caller fails an identity check and asks for money, decline the payment right away",</text>
  <text x="58" y="914" class="s">and call 3 scored 100.  Fake bank asking for a code: 97 · 100 · 100 · 100, passed.</text>

  <!-- agentic self-improvement -->
  <rect x="800" y="640" width="760" height="308" rx="14" fill="#f2f9f5" stroke="#1f8a5b" stroke-width="2"/>
  <text x="820" y="668" class="k" fill="#1f8a5b">AGENTIC SELF-IMPROVEMENT · after every call and in eval suites</text>
  <rect class="box" x="818" y="684" width="232" height="104" rx="10"/>
  <text x="834" y="708" class="t">1 · The call</text><text x="834" y="730" class="s">a real call, or a simulated</text><text x="834" y="748" class="s">one: Gemini 4 Hydrogen</text><text x="834" y="766" class="s">plays the caller live</text>
  <rect class="code" x="1064" y="684" width="232" height="104" rx="10"/>
  <text x="1080" y="708" class="t">2 · Judge (code)</text><text x="1080" y="730" class="s">right verdict? false alarm?</text><text x="1080" y="748" class="s">High on the money line?</text><text x="1080" y="766" class="s">check asked first? leaks?</text>
  <rect class="stage" x="1310" y="684" width="232" height="104" rx="10"/>
  <text x="1326" y="708" class="t">3 · Critic</text><text x="1326" y="730" class="s">Gemini 4 Neon, high thinking:</text><text x="1326" y="748" class="s">grades 1–5, blind to the</text><text x="1326" y="766" class="s">answer, proposes ≤3 lessons</text>
  <rect class="stage" x="1310" y="826" width="232" height="104" rx="10"/>
  <text x="1326" y="850" class="t">4 · Consolidate</text><text x="1326" y="872" class="s">Gemini 4 Neon groups</text><text x="1326" y="890" class="s">same-meaning lessons;</text><text x="1326" y="908" class="s">it can't rewrite them</text>
  <rect class="code" x="1064" y="826" width="232" height="104" rx="10"/>
  <text x="1080" y="850" class="t">5 · Gate (code)</text><text x="1080" y="872" class="s">validate, replay weight</text><text x="1080" y="890" class="s">changes on past calls;</text><text x="1080" y="908" class="s">safety rules untouchable</text>
  <rect class="alex" x="818" y="826" width="232" height="104" rx="10"/>
  <text x="834" y="850" class="t">6 · Playbook vN</text><text x="834" y="872" class="s">≤10 active lessons,</text><text x="834" y="890" class="s">versioned, rollback;</text><text x="834" y="908" class="s">read by the next call</text>
  <path class="line" d="M1050 736 H1062"/><path class="line" d="M1296 736 H1308"/>
  <path class="line" d="M1426 788 V824"/><path class="line" d="M1310 878 H1298"/><path class="line" d="M1064 878 H1052"/>
  <path class="loop" d="M934 826 V790"/>
  <path class="loop" d="M1180 640 V600 H760 V582"/>
  <rect x="930" y="589" width="232" height="22" fill="#fbfaf8"/><text x="1046" y="605" class="s" text-anchor="middle" font-weight="600" fill="#1f8a5b">the next call starts smarter</text>

  <!-- models legend -->
  <text x="40" y="996" class="k">THE MODELS · WHAT EACH DOES · WHERE IT RUNS</text>
  <line x1="40" y1="1008" x2="1560" y2="1008" stroke="#e2dcd5" stroke-width="1.5"/>
  <rect x="40" y="1015" width="1520" height="28" fill="#f4f1ed"/>
  <text x="52" y="1034" class="s" font-weight="700" fill="#1d1b1a">Gemini 3.5 Transcribe Live</text><text x="300" y="1034" class="s">Live speech-to-text with captions; one session per phone track</text><text x="1200" y="1034" class="s" font-weight="600" fill="#1f8a5b">Ears</text>
  <text x="52" y="1062" class="s" font-weight="700" fill="#1d1b1a">Gemini 3.5 Flash-Lite</text><text x="300" y="1062" class="s">First tailored replies in ~1.3 s; plays the caller in live demos</text><text x="1200" y="1062" class="s" font-weight="600" fill="#1f8a5b">Live brain · The call</text>
  <rect x="40" y="1071" width="1520" height="28" fill="#f4f1ed"/>
  <text x="52" y="1090" class="s" font-weight="700" fill="#1d1b1a">Gemini 4 Hydrogen</text><text x="300" y="1090" class="s">Stage 1: flags risks tied to the caller&#39;s exact words, keeps notes; plays simulated callers</text><text x="1200" y="1090" class="s" font-weight="600" fill="#1f8a5b">Live brain · Self-improvement</text>
  <text x="52" y="1118" class="s" font-weight="700" fill="#1d1b1a">Gemini 4 Argon</text><text x="300" y="1118" class="s">Planner: the next 3 replies with exact words and a confidence score</text><text x="1200" y="1118" class="s" font-weight="600" fill="#1f8a5b">Live brain</text>
  <rect x="40" y="1127" width="1520" height="28" fill="#f4f1ed"/>
  <text x="52" y="1146" class="s" font-weight="700" fill="#1d1b1a">Gemini 4 Neon</text><text x="300" y="1146" class="s">Stage 2 supervisor · follow-up agent (function calling) · critic (high thinking) + lesson merging</text><text x="1200" y="1146" class="s" font-weight="600" fill="#1f8a5b">Live brain · After hang-up · Self-improvement</text>
  <text x="52" y="1174" class="s" font-weight="700" fill="#1d1b1a">Gemini 4 Carbon</text><text x="300" y="1174" class="s">Call review: summary, verdict and tone score for Alex</text><text x="1200" y="1174" class="s" font-weight="600" fill="#1f8a5b">After hang-up</text>
  <rect x="40" y="1183" width="1520" height="28" fill="#f4f1ed"/>
  <text x="52" y="1202" class="s" font-weight="700" fill="#1d1b1a">Gemini 3.8 Flash TTS</text><text x="300" y="1202" class="s">The agent&#39;s voice (Sulafat), streamed so it starts in ~0.7 s</text><text x="1200" y="1202" class="s" font-weight="600" fill="#1f8a5b">Agent voice</text>
  <text x="40" y="1244" class="s" font-size="12.5">App code (no model) owns the risk score, the lock, the say-guard, the judge and the gate. Self-improvement lives on the evals-critic branch.</text>
</svg>
